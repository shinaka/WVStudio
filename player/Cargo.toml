[package]
name = "wvplay"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fontdue = "0.9.4"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
nusb = "0.2.7"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }
